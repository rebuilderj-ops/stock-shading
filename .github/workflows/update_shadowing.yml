name: Daily Stock Shadowing Bot

on:
  schedule:
    # 매주 월~금, 한국 시간 오후 4시 30분 실행 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-shadowing:
    runs-on: ubuntu-latest
    
    # 봇이 레포지토리에 푸쉬할 수 있도록 쓰기 권한 부여
    permissions:
      contents: write
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 파이썬 3.11 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests python-dotenv google-generativeai; fi

      - name: 주식 쉐도잉 파이썬 로봇 구동
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python scripts/update_shadowing.py

      - name: 수집된 데이터 JSON을 GitHub에 자동 저장(Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/shadowing_real_history.json
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [AI Bot] Daily Stock Shadowing Updated" && git push)
